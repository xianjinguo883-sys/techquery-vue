# Render 云平台自动部署配置
# 部署为静态站点：只需把仓库连接到 Render，它会自动执行 build 并把 dist/ 当作站点根目录。
# 详见 README.md 中的「部署到 Render」章节。

services:
  - type: web
    name: techquery-vue
    runtime: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    envVars:
      - key: NODE_VERSION
        value: 20